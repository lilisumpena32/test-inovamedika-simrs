services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: simrs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-postgres}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-simrs_app}
      DB_SVC_PASSWORD: ${DB_SVC_PASSWORD:-simrs_svc}
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simrs"]
      interval: 5s
      timeout: 5s
      retries: 12

  php:
    build:
      context: ./docker/php
    working_dir: /var/www/simrs
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: simrs
      DB_USER: simrs_app
      DB_PASSWORD: ${DB_APP_PASSWORD:-simrs_app}
      TZ: Asia/Jakarta
    volumes:
      - ./simrs:/var/www/simrs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./simrs:/var/www/simrs:ro
      - ./frontend:/var/www/frontend:ro
    depends_on:
      - php
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
