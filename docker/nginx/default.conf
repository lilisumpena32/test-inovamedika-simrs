server {
    listen 80;
    server_name _;

    root /var/www/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/simrs/web/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/simrs/web;
        fastcgi_param PATH_INFO $uri;
        fastcgi_pass php:9000;
    }
}
